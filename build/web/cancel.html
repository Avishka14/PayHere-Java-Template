<!DOCTYPE html>
<html>
<head>
  <title>Payment Cancelled</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: #fff5f5;
      color: #a94442;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #d9534f;
    }

    p {
      font-size: 1.2rem;
    }

    .icon {
      font-size: 5rem;
      margin-bottom: 1rem;
    }

    button {
      margin-top: 2rem;
      padding: 0.8rem 2rem;
      font-size: 1rem;
      color: #fff;
      background-color: #d9534f;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #c9302c;
    }
  </style>
</head>
<body>
  <div class="icon">❌</div>
  <h1>Payment Cancelled</h1>
  <p>Your payment was not completed.</p>
  <button onclick="window.location.href='index.html'">Go Back</button>
</body>
</html>
