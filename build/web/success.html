<!DOCTYPE html>
<html>
<head>
  <title>Payment Success</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: #e6ffed;
      color: #2c662d;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #28a745;
    }

    p {
      font-size: 1.2rem;
      margin: 0.5rem 0;
    }

    .icon {
      font-size: 5rem;
      margin-bottom: 1rem;
    }

    button {
      margin-top: 2rem;
      padding: 0.8rem 2rem;
      font-size: 1rem;
      color: #fff;
      background-color: #28a745;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <div class="icon">✅</div>
  <h1>Payment Successful!</h1>
  <p>Thank you for your payment.</p>
  <p id="orderId"></p>
  <button onclick="window.location.href='index.html'">Go to Home</button>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('order_id');
    if(orderId) document.getElementById('orderId').innerText = "Order ID: " + orderId;
  </script>
</body>
</html>
