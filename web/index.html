<!DOCTYPE html>
<html>
<head>
    <title>PayHere Sandbox Demo</title>
    <script src="https://www.payhere.lk/lib/payhere.js"></script>
</head>
<body>
    <h1>PayHere Demo</h1>
    <button id="pay-button">Pay LKR 100</button>
    <h1>PayHere JAVA Template by Avishka Chamod</h1>
    <script>
    window.onload = function() {
        const btn = document.getElementById('pay-button');
        btn.addEventListener('click', () => {
            fetch('http://localhost:8080/Payhere/api/payhere/hash', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            })
            .then(res => res.json())
            .then(data => {
                if(!window.payhere) return alert("PayHere SDK not loaded");

                window.payhere.onCompleted = (orderId) => {
                    alert("Payment Completed! Order: " + orderId);
                    window.location.href = data.return_url + "?order_id=" + orderId;
                };
                window.payhere.onDismissed = () => alert("Payment Cancelled");
                window.payhere.onError = (err) => alert("Payment Error: " + err);

                window.payhere.startPayment(data);
            })
            .catch(err => console.error(err));
        });
    };
    </script>
</body>
</html>
